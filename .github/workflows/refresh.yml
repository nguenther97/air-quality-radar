name: Refresh dashboard


on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '7,37 * * * *'  # Runs at 7 and 37 minutes past the hour

  workflow_dispatch: {}


permissions:
  contents: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false


jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main


      - uses: actions/setup-node@v4
        with:
          node-version: '24'


      - run: npm test


      - run: node scripts/fetch_and_build.mjs


      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --quiet --cached || git commit -m "Automated dashboard refresh"
          git push
