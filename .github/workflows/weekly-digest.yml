name: Weekly digest

on:
  schedule:
    - cron: '0 14 * * 1'  # Monday 9am ET (UTC-5 winter) / 10am ET (UTC-4 summer) — close enough
  workflow_dispatch: {}

permissions:
  issues: read

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIGEST_WEBHOOK_URL: ${{ secrets.DIGEST_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install

      - run: node scripts/weekly_digest.mjs
